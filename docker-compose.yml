services:
  mysql:
    image: mysql:8
    container_name: springedumanager-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: springedumanager
      MYSQL_USER: springedu
      MYSQL_PASSWORD: springedupass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: springedumanager-phpmyadmin
    depends_on:
      - mysql
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: springedu
      PMA_PASSWORD: springedupass
    volumes:
      - phpmyadmin_data:/etc/phpmyadmin

volumes:
  mysql_data:
  phpmyadmin_data:
