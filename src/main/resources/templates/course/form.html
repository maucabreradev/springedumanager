<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${curso.id == null} ? 'Nuevo Curso' : 'Editar Curso'">Formulario de Curso</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="layout/layout :: header"></header>
<main>
    <div class="container" th:fragment="content">
        <h1 th:text="${curso.id == null} ? 'Nuevo Curso' : 'Editar Curso'">Formulario de Curso</h1>
        <form th:action="${curso.id == null} ? @{/admin/courses} : @{/admin/courses/__{curso.id}__}" method="post" class="auth-form">
            <input type="hidden" th:if="${curso.id != null}" th:field="*{id}" />
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" th:field="*{nombre}" required>
            </div>
            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" th:field="*{descripcion}"></textarea>
            </div>
            <div class="form-group">
                <label for="creditos">Créditos</label>
                <input type="number" id="creditos" name="creditos" th:field="*{creditos}" required>
            </div>
            <div class="form-group">
                <label for="coordinador">Coordinador</label>
                <input type="text" id="coordinador" name="coordinador" th:field="*{coordinador}">
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>
</main>
<footer th:replace="layout/layout :: footer"></footer>
</body>
</html>
