<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${practica.titulo}">Detalle de Práctica</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="layout/layout :: header"></header>
<main>
    <div class="container" th:fragment="content">
        <h1 th:text="${practica.titulo}">Práctica</h1>
        <a th:href="@{/admin/practices}" class="btn btn-secondary">Volver a la Lista</a>
        <div class="card">
            <h2 th:text="${practica.titulo}">Título</h2>
            <p th:text="${practica.descripcion}">Descripción</p>
            <p><strong>Curso:</strong> <span th:text="${practica.curso?.nombre}">-</span></p>
            <p><strong>Fecha de Entrega:</strong> <span th:text="${#temporals.format(practica.fechaEntrega, 'dd/MM/yyyy')}">-</span></p>
            <p><strong>Estado:</strong> <span th:text="${practica.estado}">-</span></p>
        </div>
    </div>
</main>
<footer th:replace="layout/layout :: footer"></footer>
</body>
</html>
