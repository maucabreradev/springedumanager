<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">SpringEduManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="header">
    <nav>
        <div class="brand">
            <a th:href="@{/}">SpringEduManager</a>
        </div>
        <div class="nav-links">
            <a th:href="@{/estudiante/courses}">Cursos</a>
            <a th:href="@{/estudiante/practices}">Prácticas</a>
            <a th:href="@{/estudiante/evaluations}">Evaluaciones</a>
            <a th:href="@{/logout}">Cerrar Sesión</a>
        </div>
    </nav>
</header>
<main>
    <div class="container" th:fragment="content">
        <nav th:if="${#strings.startsWith(#httpServletRequest.requestURI, '/admin')}" class="breadcrumbs">
            <a th:href="@{/admin}">Admin</a> &gt;
            <a th:href="@{/admin/courses}">Cursos</a> &gt;
            <span th:text="${#httpServletRequest.requestURI}"></span>
        </nav>
        <nav th:if="${#strings.startsWith(#httpServletRequest.requestURI, '/estudiante')}" class="breadcrumbs">
            <a th:href="@{/estudiante/dashboard}">Dashboard</a> &gt;
            <span th:text="${#httpServletRequest.requestURI}"></span>
        </nav>
        <div th:if="${message}" class="success" th:text="${message}"></div>
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <div th:fragment="content">
            Contenido predeterminado
        </div>
    </div>
</main>
<footer th:fragment="footer">
    <p>&copy; 2026 SpringEduManager. Todos los derechos reservados.</p>
</footer>
</body>
</html>
