<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">SpringEduManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="header">
    <nav>
        <div class="brand">
            <a th:href="@{/}">SpringEduManager</a>
        </div>
        <div class="nav-links">
            <a th:href="@{/estudiante/courses}">Cursos</a>
            <a th:href="@{/estudiante/practices}">Prácticas</a>
            <a th:href="@{/estudiante/evaluations}">Evaluaciones</a>
            <a th:href="@{/logout}">Cerrar Sesión</a>
        </div>
    </nav>
</header>
<main>
    <div class="container" th:fragment="content">
        Contenido predeterminado
    </div>
</main>
<footer th:fragment="footer">
    <p>&copy; 2026 SpringEduManager. Todos los derechos reservados.</p>
</footer>
</body>
</html>
