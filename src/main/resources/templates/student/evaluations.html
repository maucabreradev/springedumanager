<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Evaluaciones</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="layout/layout :: header"></header>
<main>
    <div class="container" th:fragment="content">
        <h1>Mis Evaluaciones</h1>
        <table>
            <thead>
                <tr><th>Título</th><th>Curso</th><th>Puntaje Max.</th><th>Tipo</th><th>Fecha</th></tr>
            </thead>
            <tbody>
                <tr th:each="evaluacion : ${evaluaciones}">
                    <td th:text="${evaluacion.titulo}">Título</td>
                    <td th:text="${evaluacion.curso?.nombre}">Curso</td>
                    <td th:text="${evaluacion.puntajeMaximo}">Puntaje</td>
                    <td th:text="${evaluacion.tipo}">Tipo</td>
                    <td th:text="${#temporals.format(evaluacion.fecha, 'dd/MM/yyyy')}">Fecha</td>
                </tr>
                <tr th:if="${#lists.isEmpty(evaluaciones)}">
                    <td colspan="5">No tienes evaluaciones asignadas</td>
                </tr>
            </tbody>
        </table>
        <a th:href="@{/estudiante/dashboard}" class="btn btn-secondary">Volver al Dashboard</a>
    </div>
</main>
<footer th:replace="layout/layout :: footer"></footer>
</body>
</html>
