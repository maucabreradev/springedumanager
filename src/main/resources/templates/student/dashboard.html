<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="layout/layout :: header"></header>
<main>
    <div class="container">
        <h1>Dashboard de Estudiante</h1>
        <p th:text="'Bienvenido, ' + ${userEmail}">Usuario</p>
        <div class="dashboard-grid">
            <div class="card">
                <h2>Mis Cursos</h2>
                <p>Explora los cursos disponibles</p>
                <a th:href="@{/estudiante/courses}" class="btn btn-secondary">Ver Cursos</a>
            </div>
            <div class="card">
                <h2>Practicas</h2>
                <p>Revisa tus prácticas asignadas</p>
                <a th:href="@{/estudiante/practices}" class="btn btn-secondary">Ver Prácticas</a>
            </div>
            <div class="card">
                <h2>Evaluaciones</h2>
                <p>Consulta tus evaluaciones</p>
                <a th:href="@{/estudiante/evaluations}" class="btn btn-secondary">Ver Evaluaciones</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="layout/layout :: footer"></footer>
</body>
</html>
