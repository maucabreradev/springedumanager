spring:
  application:
    name: springedumanager
  datasource:
    url: jdbc:mysql://localhost:3306/springedumanager?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: springedu
    password: springedupass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.maurocabrera.springedumanager: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"